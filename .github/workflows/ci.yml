name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Neovim ${{ matrix.neovim }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        neovim: [v0.12.5, nightly]
    env:
      XDG_CONFIG_HOME: /tmp/nvim-ci/config
      XDG_DATA_HOME: ${{ github.workspace }}/.ci/data
      XDG_STATE_HOME: ${{ github.workspace }}/.ci/state
      XDG_CACHE_HOME: ${{ github.workspace }}/.ci/cache
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install Neovim
        env:
          NEOVIM_VERSION: ${{ matrix.neovim }}
        run: |
          archive="$RUNNER_TEMP/nvim.tar.gz"
          curl --fail --location --retry 5 --retry-all-errors \
            --output "$archive" \
            "https://github.com/neovim/neovim/releases/download/$NEOVIM_VERSION/nvim-linux-x86_64.tar.gz"
          sudo tar --extract --gzip --file "$archive" --directory /opt
          echo /opt/nvim-linux-x86_64/bin >> "$GITHUB_PATH"
          /opt/nvim-linux-x86_64/bin/nvim --version
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - name: Install language servers
        run: make deps
      - name: Install parser compiler
        run: sudo npm install --global tree-sitter-cli@0.27.0
      - name: Expose checkout as the Neovim config
        run: |
          mkdir -p "$XDG_CONFIG_HOME"
          ln -s "$GITHUB_WORKSPACE" "$XDG_CONFIG_HOME/nvim"
      - name: Restore plugins and parsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .ci/data/nvim/site
            .ci/data/nvim/site/parser
          key: nvim-${{ runner.os }}-${{ matrix.neovim }}-${{ hashFiles('nvim-pack-lock.json', 'lua/config/plugins.lua') }}
      - name: Install locked plugins
        run: nvim --headless --cmd "set runtimepath^=$GITHUB_WORKSPACE" -u init.lua +qa
      - name: Check configuration specification
        run: make check-config
      - name: Exercise editor configuration
        run: make test-config
      - name: Exercise review customizations
        run: make test-review
      - name: Exercise language servers
        run: make test-lsp

  windows:
    name: Windows language servers
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      XDG_DATA_HOME: ${{ github.workspace }}\.ci\data
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install Neovim
        shell: pwsh
        run: |
          $archive = "$env:RUNNER_TEMP\nvim.zip"
          Invoke-WebRequest -Uri https://github.com/neovim/neovim/releases/download/v0.12.5/nvim-win64.zip -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath C:\
          "C:\nvim-win64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          C:\nvim-win64\bin\nvim.exe --version
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - name: Install language servers
        shell: pwsh
        run: nvim -l scripts/install_deps.lua
      - name: Exercise language-server resolution
        shell: pwsh
        run: nvim --headless --cmd "set runtimepath^=$env:GITHUB_WORKSPACE" -u NONE -c "lua dofile('tests/lsp_servers.lua')"
