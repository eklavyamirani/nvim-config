[package]
name = "coauthor"
version = "0.1.0"
edition = "2024"
# std::fs::File::lock (advisory file locks) is stable from 1.89.
rust-version = "1.89"
description = "Comment threads on a document, shared by an editor and a coding agent"
publish = false

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde_json = "1.0"

[profile.release]
strip = true
